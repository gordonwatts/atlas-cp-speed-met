# MET inputs and working points from release test_configuration_Run3.yaml.
# Keep only MET and the nominal object preparation consumed by the MET stage.
CommonServices:
  runSystematics: true
  filterSystematics: '^MET_.*$'
  systematicsHistogram: systematicsList
  separateWeightSystematics: true

PileupReweighting: {}

Jets:
  - containerName: AnaJets
    jetCollection: AntiKt4EMPFlowJets
    recalibratePhyslite: false
    runJvtUpdate: false
    runNNJvtUpdate: true
    runJvtSelection: false
    runOriginalObjectLink: true
    runUncertainties: false

Electrons:
  - containerName: AnaElectrons
    recalibratePhyslite: false
    minPt: 10000.0
    WorkingPoint:
      - selectionName: loose
        identificationWP: LooseBLayerLH
        isolationWP: Tight_VarRad
        chargeIDSelectionRun2: true
        noEffSF: true
    PtEtaSelection:
      minPt: 10000.0

Photons:
  - containerName: AnaPhotons
    recomputeIsEM: false
    recalibratePhyslite: false
    WorkingPoint:
      - selectionName: tight
        qualityWP: Tight
        isolationWP: FixedCutTight
        recomputeIsEM: false
        noEffSFForID: true
        noEffSFForIso: true
    PtEtaSelection:
      minPt: 10000.0

Muons:
  - containerName: AnaMuons
    recalibratePhyslite: false
    WorkingPoint:
      - selectionName: medium
        quality: Medium
        isolation: Loose_VarRad
        noEffSF: true

TauJets:
  - containerName: AnaTauJets
    rerunTruthMatching: false
    WorkingPoint:
      - selectionName: tight
        quality: Tight
        noEffSF: true

MissingET:
  - containerName: AnaMET
    jets: AnaJets
    electrons: AnaElectrons.loose
    photons: AnaPhotons.tight
    taus: AnaTauJets.tight
    muons: AnaMuons.medium
    metWP: Tight
    useJVT: true
    saveSignificance: true
    addExtraSignificanceVars: true

Output:
  vars:
    - EventInfo.eventNumber -> eventNumber
    - EventInfo.runNumber -> runNumber
    - EventInfo.mcChannelNumber -> mcChannelNumber
    - EventInfo.averageInteractionsPerCrossing -> averageInteractionsPerCrossing
    - EventInfo.actualInteractionsPerCrossing -> actualInteractionsPerCrossing
    - AnaMET_%SYS%.mpx -> fullMet_mpx_%SYS% type=float
    - AnaMET_%SYS%.mpy -> fullMet_mpy_%SYS% type=float
    - AnaMET_%SYS%.source -> fullMet_source_%SYS% type=uint64
  containers:
    finalMet_: AnaMET
  containersFullMET:
    fullMet_: AnaMET
  commands:
    - enable fullMet_name
